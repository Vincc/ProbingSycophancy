#google/gemma-3-4b-it param meodel


model_id: "google/gemma-3-4b-it"
num_layers: 34
num_heads: 8
head_dim: 256        # hidden_size / num_heads = 2048 / 32
hidden_dim: 2560
intermediate_dim: 10240

# HuggingFace module paths (Llama)
layer_path: "model.language_model.layers"
attn_module: "self_attn.o_proj"
mlp_module: "mlp"


# Test config — hook a few middle layers
default_layer_range: [10, 12]
components: ["attn", "mlp"] # ["attn", "mlp", "residual"]

dtype: "float32"    # no GPU, run on CPU
device: "cpu"